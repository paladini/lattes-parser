name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate fixture against XSD
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          output="$(node dist/cli.js validate test/fixtures/curriculum-real-anonymized.xml)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '"valid": true'
