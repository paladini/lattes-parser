name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate fixture against XSD
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          set +e
          output="$(node dist/cli.js validate test/fixtures/curriculum-real-anonymized.xml 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] || ! printf '%s\n' "$output" | grep -q '"valid": true'; then
            exit 1
          fi
